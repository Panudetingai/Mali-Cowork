<!doctype html>
<html lang="en" suppressHydrationWarning>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Mali Cowork — desktop app for AI chat and Cowork mode: agents work in folders you allow, with local CLI agents and provider APIs."
    />
    <meta property="og:title" content="Mali Cowork" />
    <meta
      property="og:description"
      content="Desktop coworking for AI chat and agent-assisted work on your files."
    />
    <meta property="og:image" content="/icon-512.png" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>Mali Cowork</title>
    <script>
      try {
        var theme = localStorage.getItem("mali-cowork-theme");
        if (theme === "dark") document.documentElement.classList.add("dark");

        var langSettingsRaw = localStorage.getItem("mali-cowork-lang-settings");
        var langMode = "auto";
        if (langSettingsRaw) {
          try {
            var parsed = JSON.parse(langSettingsRaw);
            if (parsed && parsed.mode) langMode = parsed.mode;
          } catch (e) {}
        }
        var activeLang = "en";
        if (langMode === "th") {
          activeLang = "th";
        } else if (langMode === "en") {
          activeLang = "en";
        } else {
          var userLangs = navigator.languages || [navigator.language || ""];
          for (var i = 0; i < userLangs.length; i++) {
            if (userLangs[i] && userLangs[i].toLowerCase().indexOf("th") === 0) {
              activeLang = "th";
              break;
            }
          }
        }
        document.documentElement.lang = activeLang;
        document.documentElement.dataset.lang = activeLang;
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
