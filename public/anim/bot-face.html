<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Bot Face</title>
<style>
  :root{
    --dotColor1: #8a691d;
    --dotColor2: #f3c354;
    --dotColor3: #f0b429;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background: transparent;
  }
  body{
    min-height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .scene{
    position:relative;
    width: min(80vmin, 420px);
    aspect-ratio: 1 / 1;
  }
  .layer{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: opacity .55s cubic-bezier(.4,0,.2,1), transform .55s cubic-bezier(.4,0,.2,1), filter .55s ease;
  }

  .face-layer{ opacity:1; transform: scale(1); }
  .scene[data-phase="dots"] .face-layer{
    opacity:0;
    transform: scale(0.3);
    filter: blur(2px);
    pointer-events:none;
  }

  .float{
    width:100%;
    animation: bob 4.2s ease-in-out infinite;
  }
  @keyframes bob{
    0%,100%{ transform: translateY(0px); }
    50%{ transform: translateY(-6px); }
  }
  svg{ display:block; width:100%; height:auto; }

  .dots-layer{
    opacity:0;
    transform: scale(0.4);
    filter: blur(2px);
    pointer-events:none;
    gap: 6%;
  }
  .scene[data-phase="dots"] .dots-layer{
    opacity:1;
    transform: scale(1);
    filter: blur(0px);
  }

  .dot{
    width:20%;
    height:20%;
    border-radius:50%;
    align-self:center;
    transition: background-color 1s ease;
    animation: dotPulse 1.2s ease-in-out infinite;
  }
  .dot1{ background: var(--dotColor1); animation-delay: 0s; }
  .dot2{ background: var(--dotColor2); animation-delay: .18s; }
  .dot3{ background: var(--dotColor3); animation-delay: .36s; }
  @keyframes dotPulse{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(0.45); }
  }

  @media (prefers-reduced-motion: reduce){
    .float, .dot{ animation: none; }
    .layer, #eyesWrap, #eyeL, #eyeR{ transition: none; }
  }
</style>
</head>
<body>

  <div class="scene" id="scene" data-phase="face">

    <div class="layer face-layer">
      <div class="float">
        <svg viewBox="-125 -125 250 250" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>

              <g id="eyesWrap">
                <g id="eyeL">
                  <path d="M-9.3 -11.3A9.3 9.3 0 0 1 0 -20.6L0 -20.6A9.3 9.3 0 0 1 9.3 -11.3L9.3 11.3A9.3 9.3 0 0 1 0 20.6L0 20.6A9.3 9.3 0 0 1 -9.3 11.3Z" transform="matrix(0.93,-0.14,0.23,0.68,-29.79,14.6)" fill="#000"/>

              </g>
            </mask>
            <radialGradient id="botFill" gradientUnits="userSpaceOnUse" cx="-50.56" cy="-63.2" r="244.9">
              <stop id="stop0" offset="0%" stop-color="#f9e3ae" style="transition: stop-color 1.1s ease;"/>
              <stop id="stop32" offset="32%" stop-color="#f3c354" style="transition: stop-color 1.1s ease;"/>
              <stop id="stop72" offset="72%" stop-color="#f0b429" style="transition: stop-color 1.1s ease;"/>
              <stop id="stop100" offset="100%" stop-color="#94701d" style="transition: stop-color 1.1s ease;"/>
            </radialGradient>
          </defs>
          <g mask="url(#botMask)">
            <rect x="-158" y="-158" width="316" height="316" fill="url(#botFill)"/>
          </g>
        </svg>
      </div>
    </div>

    <div class="layer dots-layer" id="dotsLayer">
      <div class="dot dot1"></div>
      <div class="dot dot2"></div>
      <div class="dot dot3"></div>
    </div>

  </div>

<script>
(function(){
  "use strict";

  // ---------- color-by-time-of-day (runs quietly in the background) ----------
  var PALETTES = {
    day:      { s0:"#f9e3ae", s32:"#f3c354", s72:"#f0b429", s100:"#c98f1f" },
    twilight: { s0:"#fdf3d9", s32:"#f7d98a", s72:"#f3c354", s100:"#cf9f3a" },
    night:    { s0:"#c2ab74", s32:"#a17c2b", s72:"#8a691d", s100:"#4a380f" }
  };
  function periodForHour(h){
    if (h >= 8 && h < 18) return "day";
    if ((h >= 5 && h < 8) || (h >= 18 && h < 21)) return "twilight";
    return "night";
  }
  var stopEls = {
    s0: document.getElementById("stop0"),
    s32: document.getElementById("stop32"),
    s72: document.getElementById("stop72"),
    s100: document.getElementById("stop100")
  };
  var root = document.documentElement;
  function applyPalette(){
    var p = PALETTES[periodForHour(new Date().getHours())];
    stopEls.s0.setAttribute("stop-color", p.s0);
    stopEls.s32.setAttribute("stop-color", p.s32);
    stopEls.s72.setAttribute("stop-color", p.s72);
    stopEls.s100.setAttribute("stop-color", p.s100);
    root.style.setProperty("--dotColor1", p.s100);
    root.style.setProperty("--dotColor2", p.s32);
    root.style.setProperty("--dotColor3", p.s72);
  }
  applyPalette();
  setInterval(applyPalette, 60000);

  // ---------- eyes ----------
  var eyesWrap = document.getElementById("eyesWrap");
  var eyeL = document.getElementById("eyeL");
  var eyeR = document.getElementById("eyeR");
  var L_CX = -29.79, L_CY = 14.6;
  var R_CX = 20.29, R_CY = 2.49;

  function eyeTransform(cx, cy, scaleY){
    return "translate(" + cx + "," + cy + ") scale(1," + scaleY + ") translate(" + (-cx) + "," + (-cy) + ")";
  }

  var targetTx = 0, targetTy = 0, curTx = 0, curTy = 0;
  var targetSquintL = 1, curSquintL = 1;
  var blinkScaleL = 1, blinkScaleR = 1;

  function raf(){
    curTx += (targetTx - curTx) * 0.15;
    curTy += (targetTy - curTy) * 0.15;
    curSquintL += (targetSquintL - curSquintL) * 0.18;
    eyesWrap.setAttribute("transform", "translate(" + curTx.toFixed(2) + "," + curTy.toFixed(2) + ")");
    eyeL.setAttribute("transform", eyeTransform(L_CX, L_CY, Math.min(curSquintL, blinkScaleL)));
    eyeR.setAttribute("transform", eyeTransform(R_CX, R_CY, blinkScaleR));
    requestAnimationFrame(raf);
  }
  requestAnimationFrame(raf);

  // ---------- blinking (idle phase only) ----------
  var blinkAllowed = true;
  function blinkOnce(){
    blinkScaleL = 0.05; blinkScaleR = 0.05;
    setTimeout(function(){ blinkScaleL = 1; blinkScaleR = 1; }, 110);
  }
  function scheduleBlink(){
    var delay = 2000 + Math.random() * 3200;
    setTimeout(function(){
      if (blinkAllowed){
        blinkOnce();
        if (Math.random() < 0.18){ setTimeout(blinkOnce, 260); }
      }
      scheduleBlink();
    }, delay);
  }
  scheduleBlink();

  // ---------- state machine: idle (blink) -> question (quizzical squint) -> dots (thinking) -> loop ----------
  var scene = document.getElementById("scene");
  var IDLE_MS = 3200;
  var QUESTION_MS = 950;
  var DOTS_MS = 2200;

  function setPhase(name){
    scene.setAttribute("data-phase", name === "dots" ? "dots" : "face");
    if (name === "idle"){
      blinkAllowed = true;
      targetTx = 0; targetTy = 0; targetSquintL = 1;
    } else if (name === "question"){
      blinkAllowed = false;
      targetTx = 5; targetTy = -4; targetSquintL = 0.4;
    } else { // dots
      blinkAllowed = false;
      targetTx = 0; targetTy = 0; targetSquintL = 1;
    }
  }

  function loop(){
    setPhase("idle");
    setTimeout(function(){
      setPhase("question");
      setTimeout(function(){
        setPhase("dots");
        setTimeout(loop, DOTS_MS);
      }, QUESTION_MS);
    }, IDLE_MS);
  }
  loop();

})();
</script>
</body>
</html>
