[package]
name = "Mali"
version = "0.1.3"
description = "Desktop coworking app for AI chat and agent-assisted work on your files."
authors = ["panudetingai"]
edition = "2021"
# Two binaries live here: the app and the MCP runner helper.
default-run = "Mali"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mali_cowork_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mali-mcp-runner"
path = "src/bin/mcp_runner.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aisdk = { version = "0.5.2", features = ["anthropic", "openai", "openaicompatible"] }
dotenvy = "0.15"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
dirs = "6"
base64 = "0.22"
toml_edit = "0.22"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-notification = "2.4.0"
sha2 = "0.10"
walkdir = "2.5"
similar = "2"
quick-xml = "0.42"
hex = "0.4"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.39", features = ["bundled"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# Action buttons on notifications: the notification plugin only carries
# title/body/sound on desktop. Already in the tree, under notify-rust.
mac-notification-sys = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
keyring = { version = "3", features = ["windows-native"] }

[patch.crates-io]
aisdk = { path = "vendor/aisdk" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
# ต้องมี debug info ไม่งั้น crash log จาก production symbolicate ไม่ได้เลย
# split-debuginfo = "packed" ทำให้ cargo เรียก dsymutil ออกมาเป็น target/release/Mali.dSYM
# ส่วน binary ยัง strip เท่าเดิม ขนาดที่ส่งให้ผู้ใช้จึงไม่เปลี่ยน — เก็บ .dSYM แนบไปกับทุก release
debug = true
split-debuginfo = "packed"
strip = true
