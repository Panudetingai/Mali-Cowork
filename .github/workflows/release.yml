name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail in seconds, not after the Rust build, on config the bundler rejects.
      - name: Check release config
        shell: bash
        run: |
          id=$(node -p "require('./src-tauri/tauri.conf.json').identifier")
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ ! "$id" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error file=src-tauri/tauri.conf.json::identifier \"$id\" may only contain A-Z, a-z, 0-9, '-' and '.'"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error file=src-tauri/tauri.conf.json::tag $GITHUB_REF_NAME does not match version $version (expected v$version)"
            exit 1
          fi
          echo "identifier=$id version=$version"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Match CI lockfile (bun.lock is generated with Bun 1.4.x)
          bun-version: 1.4.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Code stays in this private repo; installers, `latest.json` for the
      # in-app updater, and bug reports live in the public releases repo.
      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          # Fine-grained token with Contents: read & write on the releases repo.
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Signs the update bundles; the app checks them with `plugins.updater.pubkey`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: Panudetingai
          repo: Mali-Cowork-Releases
          # Tags the releases repo's own branch: this repo's commits aren't there.
          commitish: main
          # The pushed tag; a manual run releases the version in tauri.conf.json.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Mali Cowork v__VERSION__
          releaseBody: |
            ## What's new
            - (write the changes here before publishing — the app shows this text in its update dialog)

            ## Install
            New here? See the [install guide](https://github.com/Panudetingai/Mali-Cowork-Releases#readme).
            Already installed? The app offers this update by itself.
          # A draft until you press Publish: the app only sees published releases,
          # so you can try the build (and write the notes) first.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          # Windows updates through the NSIS installer (see `installMode`).
          updaterJsonPreferNsis: true
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
