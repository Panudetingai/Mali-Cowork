name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Mali Cowork v__VERSION__
          releaseBody: |
            ## Install

            ### macOS
            Download the `.dmg`, open it, and drag **Mali Cowork** into Applications.

            This build is not notarized. On first launch, use **Right click → Open** if macOS blocks the app.

            ### Windows
            Download the `.msi` installer or NSIS `setup.exe` and run the installer.

            Built from this tag via GitHub Actions.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
