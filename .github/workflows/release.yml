name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_env_target: universal-apple-darwin
          - platform: windows-latest
            args: ""
            rust_targets: ""
            tauri_env_target: ""

    runs-on: ${{ matrix.platform }}
    env:
      TAURI_ENV_TARGET_TRIPLE: ${{ matrix.tauri_env_target }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail in seconds, not after the Rust build, on config the bundler rejects.
      - name: Check release config
        shell: bash
        run: |
          id=$(node -p "require('./src-tauri/tauri.conf.json').identifier")
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ ! "$id" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error file=src-tauri/tauri.conf.json::identifier \"$id\" may only contain A-Z, a-z, 0-9, '-' and '.'"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error file=src-tauri/tauri.conf.json::tag $GITHUB_REF_NAME does not match version $version (expected v$version)"
            exit 1
          fi
          echo "identifier=$id version=$version"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Match CI lockfile (bun.lock is generated with Bun 1.4.x)
          bun-version: 1.4.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Catch sidecar / lib compile errors before the long Tauri build (e.g. bad sysinfo API use).
      - name: Cargo check (lib and mali-mcp-runner)
        shell: bash
        run: |
          set -euo pipefail
          cargo check --manifest-path src-tauri/Cargo.toml --lib --bins
          if [[ "${{ matrix.platform }}" == macos-latest ]]; then
            for t in aarch64-apple-darwin x86_64-apple-darwin; do
              cargo check --manifest-path src-tauri/Cargo.toml --bin mali-mcp-runner --target "$t"
            done
          fi

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Code stays in this private repo; installers, `latest.json` for the
      # in-app updater, and bug reports live in the public releases repo.
      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          # Fine-grained token with Contents: read & write on the releases repo.
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Signs the update bundles; the app checks them with `plugins.updater.pubkey`.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          owner: Panudetingai
          repo: Mali-Cowork-Releases
          # Tag is created from this branch on Mali-Cowork-Releases (not this private repo).
          releaseCommitish: main
          # The pushed tag; a manual run releases the version in tauri.conf.json.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Mali Cowork v__VERSION__
          releaseBody: |
            ## What's new
            - (write the changes here before publishing — the app shows this text in its update dialog)

            ### Windows
            Download the NSIS `setup.exe` installer and run it.

            Built from this tag via GitHub Actions.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          # Windows updates through the NSIS installer (see `installMode`).
          updaterJsonPreferNsis: true
          tauriScript: bun run tauri
          args: ${{ matrix.args }}

  # tauri-action publishes directly to Panudetingai/Mali-Cowork-Releases; confirm the release is complete.
  verify-public-release:
    name: Verify public release
    needs: build-tauri
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (resolve version on manual runs)
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "name=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            version=$(node -p "require('./src-tauri/tauri.conf.json').version")
            echo "name=v${version}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Panudetingai/Mali-Cowork-Releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.tag.outputs.name }}"
          public_repo="Panudetingai/Mali-Cowork-Releases"

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::RELEASES_TOKEN is not set — see docs/RELEASES_REPO_SETUP.md"
            exit 1
          fi

          if ! gh release view "$tag" --repo "$public_repo" >/dev/null 2>&1; then
            echo "::error::Release $tag not found on $public_repo (tauri-action should have created it)"
            exit 1
          fi

          assets_json="$(gh release view "$tag" --repo "$public_repo" --json assets,name,body)"
          asset_names="$(echo "$assets_json" | jq -r '.assets[].name')"
          echo "Public release assets:"
          echo "$asset_names"

          has_dmg=false
          has_exe=false
          has_latest=false
          while IFS= read -r name; do
            [[ -z "$name" ]] && continue
            [[ "$name" == *.dmg ]] && has_dmg=true
            [[ "$name" == *.exe ]] && has_exe=true
            [[ "$name" == latest.json ]] && has_latest=true
          done <<< "$asset_names"

          if [[ "$has_dmg" != true || "$has_exe" != true || "$has_latest" != true ]]; then
            echo "::error::Expected .dmg, .exe, and latest.json on $public_repo release $tag"
            echo "Found:"
            echo "$asset_names"
            exit 1
          fi

          body="$(echo "$assets_json" | jq -r '.body // empty')"
          if [[ -z "$body" ]]; then
            echo "::warning::Release $tag has empty notes — edit them on $public_repo before users update"
          fi

          title="$(echo "$assets_json" | jq -r '.name // empty')"
          echo "Verified public release: $title ($tag)"
