name: Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag (must match src-tauri/tauri.conf.json), e.g. v0.1.2"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fail in seconds, not after the Rust build, on config the bundler rejects.
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          expected="v${version}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            tag="${{ github.ref_name }}"
          elif [[ -n "${{ inputs.version_tag }}" ]]; then
            tag="${{ inputs.version_tag }}"
          else
            tag="$expected"
          fi
          if [[ "$tag" != "$expected" ]]; then
            echo "::error::tag $tag does not match tauri.conf.json version $version (expected $expected)"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check release config
        shell: bash
        run: |
          id=$(node -p "require('./src-tauri/tauri.conf.json').identifier")
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ ! "$id" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error file=src-tauri/tauri.conf.json::identifier \"$id\" may only contain A-Z, a-z, 0-9, '-' and '.'"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error file=src-tauri/tauri.conf.json::tag $GITHUB_REF_NAME does not match version $version (expected v$version)"
            exit 1
          fi
          echo "identifier=$id version=$version"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Match CI lockfile (bun.lock is generated with Bun 1.4.x)
          bun-version: 1.4.2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The pushed tag; a manual run releases the version in tauri.conf.json.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || steps.release_tag.outputs.tag }}
          releaseName: Mali Cowork v__VERSION__
          releaseBody: |
            ## Install

            ### macOS
            Download the `.dmg`, open it, and drag **Mali Cowork** into Applications.

            This build is not notarized. On first launch, use **Right click → Open** if macOS blocks the app.

            ### Windows
            Download the `.msi` installer or NSIS `setup.exe` and run the installer.

            Built from this tag via GitHub Actions.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
